# Automatic code review: Claude reviews every pull request when it is opened
# and again each time new commits are pushed to it.
#
# One-time setup: add an Anthropic API key as a repository secret named
# ANTHROPIC_API_KEY (GitHub → Settings → Secrets and variables → Actions),
# or run /install-github-app in Claude Code, which also installs the Claude GitHub app.

name: PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skip PRs that only change eval results or docs.
    paths-ignore:
      - "eval_results.json"
      - "**/*.md"

# Cancel an older review of the same PR when new commits arrive.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Draft PRs aren't reviewed until they're marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read        # read the code
      pull-requests: write  # post review comments
      issues: write         # post the summary comment
      id-token: write       # used by the action to authenticate

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. This repo is a local meal-planning agent:
            agent.py (conversation, JSON plan extraction, self-repair), ingredient_match.py
            (pantry matching shared with the eval), eval.py (rule checks + LLM judge).

            Look for, in this order:
            1. Bugs: wrong logic, unhandled None/empty values, broken JSON or schema handling.
            2. Prompt changes in agent.py: anything that could make the model add meals,
               break diet rules, or stop producing a plan.
            3. Changes to agent.py or ingredient_match.py that aren't covered by tests in test/.
            4. Readability: the author prefers plain loops and small named helpers over
               compact one-liners.

            Use inline comments for specific lines, and one short summary comment at the end.
            Only report real problems; say so plainly if you find none.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
